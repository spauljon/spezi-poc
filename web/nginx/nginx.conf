# The clinician web app, deployed (M13a). TLS on :3000 (all interfaces; allow-listed in the root CLAUDE.md).
#
#   /            the built single-page app (index.html for any path without a file: /callback is the OIDC redirect)
#   /fhir/*      -> HAPI            GET/HEAD only; the browser's bearer token passes through, HAPI verifies it
#   /analytics/* -> analytic API    GET/HEAD only; prefix stripped; the API verifies the token
#
# The browser only ever talks to this origin, so HAPI needs no CORS. Upstream TLS is verified (POC CA, certificate
# name macpro16.local) even though the hops are inside the compose network. Runs as the host user's uid, not root.

pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 1k;   # GET only: no body is ever expected
  large_client_header_buffers 4 16k;   # a bearer token rides in a header

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Docker's embedded DNS, at request time: nginx starts and survives HAPI or the API restarting.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Path only: never the query string, never headers (the Authorization header is not logged).
  log_format web '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
  access_log /dev/stdout web;

  server {
    listen 3000 ssl;
    http2 on;
    server_name macpro16.local;

    ssl_certificate     /etc/nginx/tls/web.crt;
    ssl_certificate_key /etc/nginx/tls/web.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The app calls its own origin and Keycloak's token/discovery endpoints (CORS is allowed by Keycloak for this
    # origin); nothing else, and no inline script.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://macpro16.local:8444; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location /fhir/ {
      set $hapi hapi:8443;
      proxy_pass https://$hapi;   # the original URI (/fhir/...) is forwarded unchanged
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/nginx/tls/ca.crt;
      proxy_ssl_server_name on;
      proxy_ssl_name macpro16.local;
      proxy_set_header Host macpro16.local:8443;
      proxy_set_header Cookie "";
      proxy_read_timeout 60s;
    }

    location /analytics/ {
      set $api analytics-api:8445;
      rewrite ^/analytics/(.*)$ /$1 break;
      proxy_pass https://$api;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/nginx/tls/ca.crt;
      proxy_ssl_server_name on;
      proxy_ssl_name macpro16.local;
      proxy_set_header Host macpro16.local:8445;
      proxy_set_header Cookie "";
      proxy_read_timeout 60s;
    }

    # Hashed build assets are immutable; everything else (index.html) is never cached.
    location /assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header Content-Security-Policy "default-src 'self'" always;
      add_header X-Content-Type-Options nosniff always;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
