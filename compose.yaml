# POC stack (M1): its own Oracle Free container and its own HAPI container.
# Independent of the governance project: everything belongs to the compose project (name: below),
# which labels each container and prefixes the network, volume and built image with "spezi-poc".
# container_name is set explicitly with the same prefix; container names are unique across the whole
# Docker host, so keep the "spezi-poc-" prefix to avoid colliding with other stacks.
# HAPI serves HTTPS only (scripts/make-tls.sh makes the certs).
# Published ports: Oracle (1522) and the analytic API (8445) on loopback only; HAPI (8443), the IdP proxy (8444) and
# the web app (3000) on all interfaces, TLS only, with a verified token required for any data. Never publish a
# plain-HTTP or unauthenticated service on all interfaces (see root CLAUDE.md, Isolation).
#
# Database initialization (PDBs, users, HAPI schema) is part of the oracle service itself: db/init.sh runs
# inside the container on every start as an Oracle image startup hook (db/startup/10-poc-init.sh), and
# the healthcheck reports healthy only once it has succeeded. There is no separate init service, profile or
# marker; everything that depends on oracle being healthy depends on an initialized database.
# Restart policy: every service is `unless-stopped`, so a daemon restart (reboot, Docker Desktop) brings the whole
# stack back, while `docker stop` / `make stack-down` stay stopped. The daemon ignores depends_on and starts
# everything at once; services that start early retry until their dependencies are up (HAPI and Keycloak exit on
# a database they cannot reach and are restarted by the policy). oracle never exits on a failed init, so no loop.
# Deploy through scripts/compose.sh (explicit project), e.g. `make stack-up`.
name: spezi-poc

services:
  oracle:
    container_name: spezi-poc-oracle
    image: container-registry.oracle.com/database/free:23.26.0.0-arm64
    platform: linux/arm64
    ports:
      - '127.0.0.1:1522:1521'
    env_file:
      - ./db/.env.local
    environment:
      ORACLE_CHARACTERSET: AL32UTF8
    restart: unless-stopped
    volumes:
      - oracle_data:/opt/oracle/oradata
      # Startup hook (a directory of its own: the image runs every *.sql and sources every *.sh in it).
      - ./db/startup:/opt/oracle/scripts/startup:ro
      - ./db:/opt/poc/db:ro
      - ./hapi/schema:/opt/poc/hapi-schema:ro
      - ./analytics/sql:/opt/poc/analytics-sql:ro
    healthcheck:
      # Healthy = the CDB answers AND this start's db/init.sh run succeeded (db/init-status.sh).
      test:
        [
          'CMD-SHELL',
          'echo "select ''CDB_IS_READY'' from dual;" | sqlplus -s -L "sys/$${ORACLE_PWD}@localhost:1521/FREE as sysdba" | grep -q CDB_IS_READY && [ "$$(bash /opt/poc/db/init-status.sh)" = ok ]'
        ]
      interval: 20s
      timeout: 10s
      retries: 20
      # A first start creates the database AND three PDBs before it can be healthy; failures inside this window
      # do not count, and the first success ends it. bootstrap.sh watches for a failed init sooner.
      start_period: 1200s

  hapi:
    container_name: spezi-poc-hapi
    build:
      context: ./hapi
      dockerfile: Dockerfile
    ports:
      # HTTPS only. Opened to the network in M4, after token verification passed (every /fhir request needs a
      # verified bearer token except GET /fhir/metadata; nothing outside /fhir is served).
      - '8443:8443'
    volumes:
      # Server key + certificate chain. Lives outside the repo; the CA key is never mounted.
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/hapi/server.p12:/app/tls/server.p12:ro
      # Public CA certificate only: used to verify the IdP's TLS when fetching its signing keys (M4).
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/ca.crt:/app/tls/ca.crt:ro
    environment:
      JAVA_OPTS: -Duser.timezone=UTC
    env_file:
      - ./hapi/.env.local
    configs:
      - source: hapi_config
        target: /app/config/application.yaml
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider -O /dev/null http://127.0.0.1:8081/actuator/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # --- IdP (M3a). Part of the normal stack. Keycloak is NEVER published; only the proxy is (TLS, public
  # OIDC paths only). The first `make stack-up` pulls the pinned Keycloak image (about 264 MB compressed).
  keycloak:
    container_name: spezi-poc-keycloak
    # 26.8.0 (pinned by digest in idp/keycloak/Dockerfile) plus the Oracle JDBC driver, built with `kc.sh build` (M3c).
    build:
      context: ./idp/keycloak
    image: spezi-poc-keycloak:26.8.0-oracle
    command:
      - start
      - --optimized                # build-time options (db=oracle, health) are baked into the image
      - --hostname=https://macpro16.local:8444
      - --proxy-headers=xforwarded
      - --http-enabled=false
      - --https-key-store-file=/opt/keycloak/tls/keycloak.p12
      - --https-key-store-type=PKCS12
      - --import-realm             # imports idp/realm/poc-realm.json at first start; skipped once the realm exists
      # Management port (health) stays inside the container: plain HTTP, container loopback, unpublished.
      # [UNVERIFIED] --http-management-host accepting 127.0.0.1; tested when the image is first run.
      - --http-management-port=9000
      - --http-management-scheme=http
      - --http-management-host=127.0.0.1
      # Database (M3c): KEYCLOAKPDB on the POC Oracle. Connects as the application user `keycloak` (CREATE SESSION +
      # DML only); the objects belong to keycloak_owner and are reached with --db-schema. The schema is loaded by
      # idp/db-migrate.sh, so Keycloak must never try to change it: manual strategy, no auto-initialize.
      - --db-url=jdbc:oracle:thin:@//oracle:1521/KEYCLOAKPDB
      - --db-schema=KEYCLOAK_OWNER
      - --db-pool-max-size=10      # default is 100; the instance allows 200 processes and HAPI holds 10
      - --spi-connections-jpa--quarkus--migration-strategy=manual
      - --spi-connections-jpa--quarkus--initialize-empty=false
    env_file:
      - ./idp/.env.local           # bootstrap admin, KC_DB_USERNAME/KC_DB_PASSWORD, key store password (gitignored)
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    mem_limit: 1536m
    extra_hosts:
      # Keycloak (and kcadm inside it) reaches its own public name without leaving the container, so the
      # certificate name (macpro16.local) verifies and nothing has to be switched off.
      - "macpro16.local:127.0.0.1"
    volumes:
      - ./idp/realm:/opt/keycloak/data/import:ro   # the realm as code; ${ENV} placeholders come from idp/.env.local
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/idp/keycloak.p12:/opt/keycloak/tls/keycloak.p12:ro
    healthcheck:
      # [UNVERIFIED] The image likely has no curl; probe the management port with bash only.
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && while read -r l <&3; do case "$$l" in *\"UP\"*) exit 0;; esac; done; exit 1'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  idp-edge:
    container_name: spezi-poc-idp-edge
    image: nginx@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752   # nginx 1.31.3 (alpine, arm64), already local
    ports:
      # The one network-reachable IdP endpoint: TLS only, public OIDC paths only (idp/nginx/nginx.conf).
      - '8444:8444'
    volumes:
      - ./idp/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/idp/edge.crt:/etc/nginx/tls/edge.crt:ro
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/idp/edge.key:/etc/nginx/tls/edge.key:ro
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/ca.crt:/etc/nginx/tls/ca.crt:ro
    networks:
      default:
        aliases:
          - macpro16.local   # so HAPI reaches the proxy under the issuer's public name (certificate name matches)
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      # Healthy = the IdP answers THROUGH the proxy (realm discovery document, public and allowlisted), not merely
      # that nginx listens: dependents (worker, API) wait on this, and a port check passes while Keycloak is down.
      # The Host header is required (the proxy refuses any other with 421). /ping stays up regardless of Keycloak.
      test:
        - CMD-SHELL
        - "wget -q --no-check-certificate --header='Host: macpro16.local' -O /dev/null https://127.0.0.1:8444/realms/poc/.well-known/openid-configuration || exit 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # --- Analytics worker, analytic API and web app (M13a): deployed, supervised, started by `make stack-up`.
  # The analytics image is built once and shared by the worker and the API. All three run as the invoking user's
  # uid (scripts/compose.sh exports POC_UID/POC_GID), read-only, with no capabilities, and restart on failure.
  # macpro16.local is mapped to the host gateway for the worker and the API: the published HAPI (8443) and IdP (8444)
  # ports are what their certificates (issued for that name) are verified against, and the issuer URL in tokens is
  # that name. The web app's nginx reaches HAPI and the API inside the compose network with verified TLS.
  analytics-worker:
    container_name: spezi-poc-analytics-worker
    build: &analytics-build
      context: .
      dockerfile: analytics/Dockerfile
    image: spezi-poc-analytics:local
    command: [node, --import, tsx, src/main.ts, loop]
    user: "${POC_UID:-1000}:${POC_GID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    env_file:
      - ./analytics/.env.local   # ANALYTICS_DB_USER/PASSWORD and the worker's client secret, nothing else
    environment:
      POC_ANALYTICS_CONNECT: oracle:1521/ANALYTICSPDB
      POC_ISSUER_URL: https://macpro16.local:8444/realms/poc
      POC_FHIR_BASE_URL: https://macpro16.local:8443/fhir
      POC_WORKER_INTERVAL_SECONDS: '30'
      POC_HEARTBEAT_FILE: /tmp/heartbeat
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
    extra_hosts:
      - 'macpro16.local:host-gateway'
    volumes:
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/ca.crt:/tls/ca.crt:ro
    depends_on:
      oracle:
        condition: service_healthy
      hapi:
        condition: service_healthy
      idp-edge:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, healthcheck.mjs, worker]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: &log-limit
      driver: json-file
      options: { max-size: 5m, max-file: '3' }

  analytics-api:
    container_name: spezi-poc-analytics-api
    build: *analytics-build
    image: spezi-poc-analytics:local
    command: [node, --import, tsx, src/main.ts, api]
    user: "${POC_UID:-1000}:${POC_GID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    ports:
      # Loopback only (M11 decision): reachable from this host for curl and tests, not from the network. The web
      # app's nginx reaches it inside the compose network.
      - '127.0.0.1:8445:8445'
    env_file:
      - ./analytics/.env.api.local   # database account only: the API never holds the worker's client secret
    environment:
      POC_ANALYTICS_CONNECT: oracle:1521/ANALYTICSPDB
      POC_ISSUER_URL: https://macpro16.local:8444/realms/poc
      POC_API_LISTEN: 0.0.0.0        # inside the container; the host publish above is loopback only
      POC_API_PORT: '8445'
      POC_API_TLS_DIR: /tls/analytics
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
    extra_hosts:
      - 'macpro16.local:host-gateway'
    volumes:
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/ca.crt:/tls/ca.crt:ro
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/analytics:/tls/analytics:ro
    depends_on:
      oracle:
        condition: service_healthy
      idp-edge:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, healthcheck.mjs, api]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *log-limit

  web:
    container_name: spezi-poc-web
    build:
      context: .
      dockerfile: web/Dockerfile
    image: spezi-poc-web:local
    user: "${POC_UID:-1000}:${POC_GID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    ports:
      # TLS only, all interfaces (decision recorded in the root CLAUDE.md): the static bundle and a GET-only relay to
      # token-protected services; it holds no data and no credentials.
      - '3000:3000'
    volumes:
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/web/web.crt:/etc/nginx/tls/web.crt:ro
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/web/web.key:/etc/nginx/tls/web.key:ro
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/ca.crt:/etc/nginx/tls/ca.crt:ro
    depends_on:
      analytics-api:
        condition: service_healthy
      hapi:
        condition: service_healthy   # the app relays /fhir (nginx re-resolves upstreams per request, so this is ordering, not a start-up requirement)
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --no-check-certificate --spider https://127.0.0.1:3000/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *log-limit

configs:
  hapi_config:
    file: ./hapi/application.yaml

volumes:
  oracle_data:
