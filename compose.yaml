# POC stack (M1): its own Oracle Free container and its own HAPI container.
# Independent of the governance project: everything belongs to the compose project (name: below),
# which labels each container and prefixes the network, volume and built image with "spezi-poc".
# container_name is set explicitly with the same prefix; container names are unique across the whole
# Docker host, so keep the "spezi-poc-" prefix to avoid colliding with other stacks.
# HAPI serves HTTPS only (scripts/make-tls.sh makes the certs).
# Published ports are bound to loopback only. Never publish a plain-HTTP or unauthenticated
# service on all interfaces (see root CLAUDE.md, Isolation).
#
# oracle-init runs exactly once, during first-time setup (profile "initialize"). scripts/bootstrap.sh
# activates that profile only while db/.initialized is absent, waits for the init to succeed, removes
# the exited init container, then writes the marker. Later runs are a plain `up -d` with no init
# service in sight. Startup order on a first run: oracle (healthy) -> oracle-init (completed
# successfully) -> hapi; the hapi dependency is optional so it is ignored when the profile is inactive.
# Deploy through scripts/compose.sh (explicit project), e.g. `make stack-up`.
name: spezi-poc

services:
  oracle:
    container_name: spezi-poc-oracle
    image: container-registry.oracle.com/database/free:23.26.0.0-arm64
    platform: linux/arm64
    ports:
      - '127.0.0.1:1522:1521'
    env_file:
      - ./db/.env.local
    environment:
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'echo "select ''CDB_IS_READY'' from dual;" | sqlplus -s -L "sys/$${ORACLE_PWD}@localhost:1521/FREE as sysdba" | grep -q CDB_IS_READY'
        ]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 120s

  oracle-init:
    container_name: spezi-poc-oracle-init
    image: container-registry.oracle.com/database/free:23.26.0.0-arm64
    platform: linux/arm64
    profiles:
      - initialize
    depends_on:
      oracle:
        condition: service_healthy
    env_file:
      - ./db/.env.local
    volumes:
      - ./db:/opt/poc/db:ro
      - ./hapi/schema:/opt/poc/hapi-schema:ro
    command: bash /opt/poc/db/init.sh
    restart: 'no'

  hapi:
    container_name: spezi-poc-hapi
    build:
      context: ./hapi
      dockerfile: Dockerfile
    ports:
      # HTTPS only. Opened to the network in M4, after token verification passed (every /fhir request needs a
      # verified bearer token except GET /fhir/metadata; nothing outside /fhir is served).
      - '8443:8443'
    volumes:
      # Server key + certificate chain. Lives outside the repo; the CA key is never mounted.
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/hapi/server.p12:/app/tls/server.p12:ro
      # Public CA certificate only: used to verify the IdP's TLS when fetching its signing keys (M4).
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/ca.crt:/app/tls/ca.crt:ro
    environment:
      JAVA_OPTS: -Duser.timezone=UTC
    env_file:
      - ./hapi/.env.local
    configs:
      - source: hapi_config
        target: /app/config/application.yaml
    depends_on:
      oracle:
        condition: service_healthy
      # Only enforced while the initialize profile is active (first run); ignored afterwards.
      oracle-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider -O /dev/null http://127.0.0.1:8081/actuator/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # --- IdP (M3a). Part of the normal stack. Keycloak is NEVER published; only the proxy is (TLS, public
  # OIDC paths only). The first `make stack-up` pulls the pinned Keycloak image (about 264 MB compressed).
  keycloak:
    container_name: spezi-poc-keycloak
    # 26.8.0 (pinned by digest in idp/keycloak/Dockerfile) plus the Oracle JDBC driver, built with `kc.sh build` (M3c).
    build:
      context: ./idp/keycloak
    image: spezi-poc-keycloak:26.8.0-oracle
    command:
      - start
      - --optimized                # build-time options (db=oracle, health) are baked into the image
      - --hostname=https://macpro16.local:8444
      - --proxy-headers=xforwarded
      - --http-enabled=false
      - --https-key-store-file=/opt/keycloak/tls/keycloak.p12
      - --https-key-store-type=PKCS12
      - --import-realm             # imports idp/realm/poc-realm.json at first start; skipped once the realm exists
      # Management port (health) stays inside the container: plain HTTP, container loopback, unpublished.
      # [UNVERIFIED] --http-management-host accepting 127.0.0.1; tested when the image is first run.
      - --http-management-port=9000
      - --http-management-scheme=http
      - --http-management-host=127.0.0.1
      # Database (M3c): KEYCLOAKPDB on the POC Oracle. Connects as the application user `keycloak` (CREATE SESSION +
      # DML only); the objects belong to keycloak_owner and are reached with --db-schema. The schema is loaded by
      # idp/db-migrate.sh, so Keycloak must never try to change it: manual strategy, no auto-initialize.
      - --db-url=jdbc:oracle:thin:@//oracle:1521/KEYCLOAKPDB
      - --db-schema=KEYCLOAK_OWNER
      - --db-pool-max-size=10      # default is 100; the instance allows 200 processes and HAPI holds 10
      - --spi-connections-jpa--quarkus--migration-strategy=manual
      - --spi-connections-jpa--quarkus--initialize-empty=false
    env_file:
      - ./idp/.env.local           # bootstrap admin, KC_DB_USERNAME/KC_DB_PASSWORD, key store password (gitignored)
    depends_on:
      oracle:
        condition: service_healthy
    mem_limit: 1536m
    extra_hosts:
      # Keycloak (and kcadm inside it) reaches its own public name without leaving the container, so the
      # certificate name (macpro16.local) verifies and nothing has to be switched off.
      - "macpro16.local:127.0.0.1"
    volumes:
      - ./idp/realm:/opt/keycloak/data/import:ro   # the realm as code; ${ENV} placeholders come from idp/.env.local
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/idp/keycloak.p12:/opt/keycloak/tls/keycloak.p12:ro
    healthcheck:
      # [UNVERIFIED] The image likely has no curl; probe the management port with bash only.
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && while read -r l <&3; do case "$$l" in *\"UP\"*) exit 0;; esac; done; exit 1'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  idp-edge:
    container_name: spezi-poc-idp-edge
    image: nginx@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752   # nginx 1.31.3 (alpine, arm64), already local
    ports:
      # The one network-reachable IdP endpoint: TLS only, public OIDC paths only (idp/nginx/nginx.conf).
      - '8444:8444'
    volumes:
      - ./idp/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/idp/edge.crt:/etc/nginx/tls/edge.crt:ro
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/idp/edge.key:/etc/nginx/tls/edge.key:ro
      - ${POC_TLS_DIR:-${HOME}/.poc-ca}/ca.crt:/etc/nginx/tls/ca.crt:ro
    networks:
      default:
        aliases:
          - macpro16.local   # so HAPI reaches the proxy under the issuer's public name (certificate name matches)
    depends_on:
      keycloak:
        condition: service_started   # the proxy tolerates Keycloak being down (502); /ping works regardless
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8444 || exit 1']
      interval: 10s
      timeout: 3s
      retries: 6

configs:
  hapi_config:
    file: ./hapi/application.yaml

volumes:
  oracle_data:
