# Same Gradle, AGP and Kotlin as SpeziKt's sample-app, which M24 verified builds on JDK 17 and 21 (not on JDK 25).
[versions]
agp = "8.13.0"
kotlin = "2.1.21"
connectClient = "1.1.0"
coreKtx = "1.15.0"
activity = "1.10.1"
lifecycle = "2.9.0"
junit = "4.13.2"

[libraries]
health-connect-client = { module = "androidx.health.connect:connect-client", version.ref = "connectClient" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
