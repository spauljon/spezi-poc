# AGP, Kotlin and Gradle (the wrapper) as upgraded by Android Studio on 2026-11-11; see android/CLAUDE.md.
[versions]
agp = "9.5.1"
kotlin = "2.2.10"
connectClient = "1.1.0"
coreKtx = "1.15.0"
activity = "1.10.1"
lifecycle = "2.9.0"
junit = "4.13.2"

[libraries]
health-connect-client = { module = "androidx.health.connect:connect-client", version.ref = "connectClient" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
