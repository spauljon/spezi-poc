# IdP edge proxy (M3a). Terminates TLS for https://macpro16.local:8444 and forwards ONLY the public OIDC
# paths to Keycloak, which is never published. Keycloak has no built-in way to restrict its admin console,
# so this allowlist is the control (see docs/planning/keycloak-notes.md).
#
# Rules, in order, for every request:
#   1. Host must be macpro16.local, else the default server answers 421.
#   (Denials issued here carry an X-Edge-Denied header naming the rule that fired.)
#   2. The RAW request path (as the client sent it, before nginx normalizes anything) must not contain
#      "..", ";", "//", or an encoded dot, slash or backslash, else 400. Matching on a normalized path while
#      forwarding the raw one is how admin-path blocking gets bypassed, so the raw path is what is judged.
#   3. The raw path must match the allowlist (/realms/poc/..., /resources/..., /.well-known/...), else 404.
#      That makes /admin/, /realms/master/, /metrics, /health and / all 404.
# Query strings are not path-checked (redirect_uri legitimately contains encoded slashes) and are NOT logged.

worker_processes 1;
error_log /dev/stderr warn;   # raise to info to see client TLS rejections (e.g. 'tlsv1 alert unknown ca')

events { worker_connections 256; }

http {
  server_tokens off;
  client_max_body_size 1m;
  large_client_header_buffers 4 16k;   # Keycloak cookies and tokens can be large

  # Docker's embedded DNS: resolve "keycloak" at request time, so nginx starts (and survives Keycloak
  # restarts) even when Keycloak is not up yet; allowed paths then answer 502 instead of failing to boot.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Log the path only (never the query string, which can carry flow tokens). The User-Agent is logged so a
  # phone's request can be told from a laptop's: Docker Desktop hides client addresses (always the gateway).
  log_format idp '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';
  access_log /dev/stdout idp;

  # The path part of the raw request URI, exactly as received.
  map $request_uri $raw_path {
    ~^(?<p>[^?]*) $p;
    default       "";
  }

  # 1 if the raw path contains anything that could be read differently by nginx and Keycloak.
  map $raw_path $path_suspicious {
    default 0;
    "~*(\.\.|%2e|%2f|%5c|\x5c|%00|;|//)" 1;
  }

  # 1 only for the explicit public OIDC paths. Case-sensitive on purpose; the realm name is fixed.
  map $raw_path $path_allowed {
    default 0;
    "~^/realms/poc(/|$)"    1;
    "~^/resources/"         1;
    "~^/\.well-known/"      1;
  }

  # Any request whose Host is not macpro16.local lands here and is refused (421).
  server {
    listen 8444 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/tls/edge.crt;
    ssl_certificate_key /etc/nginx/tls/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header X-Edge-Denied "host" always;
    return 421;
  }

  server {
    listen 8444 ssl;
    server_name macpro16.local;

    ssl_certificate     /etc/nginx/tls/edge.crt;
    ssl_certificate_key /etc/nginx/tls/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Every denial issued by nginx itself carries X-Edge-Denied, so tests can tell it from a Keycloak answer.

    # Answered by nginx itself: lets the phone's CA-trust test work before any realm exists.
    location = /ping {
      default_type text/html;
      add_header Cache-Control no-store always;
      return 200 "<!doctype html><meta name='viewport' content='width=device-width,initial-scale=1'><title>IdP edge</title><body style='font:600 30px -apple-system,sans-serif;text-align:center;padding:3em 1em'>IdP edge reachable<br><small style='font:400 18px -apple-system,sans-serif'>served over TLS for $host</small></body>\n";
    }

    location / {
      if ($path_suspicious) { add_header X-Edge-Denied "suspicious-path" always; return 400; }
      if ($path_allowed = 0) { add_header X-Edge-Denied "not-allowlisted" always; return 404; }
      if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) { add_header X-Edge-Denied "method" always; return 405; }

      set $keycloak "keycloak:8443";
      proxy_pass https://$keycloak;      # variable without a URI part: the request URI goes through unchanged
      proxy_http_version 1.1;

      # Re-encrypt to Keycloak and verify its certificate against our CA (its SAN is macpro16.local).
      proxy_ssl_server_name on;
      proxy_ssl_name macpro16.local;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_trusted_certificate /etc/nginx/tls/ca.crt;
      proxy_ssl_protocols TLSv1.2 TLSv1.3;

      # Set (not append) so a client cannot spoof forwarded headers.
      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header X-Forwarded-Port  8444;

      proxy_connect_timeout 5s;
      proxy_read_timeout    60s;
      proxy_buffer_size       16k;
      proxy_buffers           4 32k;
      proxy_busy_buffers_size 64k;
    }
  }
}
